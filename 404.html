<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="PWA-зеркало paper-конвейера CryptoBot: живой Bybit WebSocket, симуляция торговли в браузере." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CryptoBot — зеркало конвейера</title>
    <script>
/* gh-pages загрузчик: assets лежат частями gzip+base64 (обход текстового канала пуша) */
(async () => {
  try {
    const m = await (await fetch('./assets/parts/manifest.json')).json();
    const b2b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const gun = async (b) => new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const load = async (fs) => gun(b2b((await Promise.all(fs.map((f) => fetch('./' + f).then((r) => r.text())))).join('')));
    const st = document.createElement('style');
    st.textContent = await load(m.css);
    document.head.appendChild(st);
    await import(URL.createObjectURL(new Blob([await load(m.js)], { type: 'text/javascript' })));
  } catch (e) {
    const d = document.createElement('div');
    d.style.cssText = 'color:#f87171;font:13px monospace;padding:24px';
    d.textContent = 'Ошибка загрузки оболочки: ' + e;
    document.body.appendChild(d);
  }
})();
</script>
    
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
