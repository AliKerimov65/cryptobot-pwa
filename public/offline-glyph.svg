<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Разорванный провод с крестиком и акцентной искрой -->
  <g stroke="#5A6378" stroke-width="2.5" stroke-linecap="round">
    <!-- левый конец провода -->
    <path d="M28 118 C 52 118, 62 104, 78 96" fill="none"/>
    <!-- правый конец провода -->
    <path d="M172 118 C 148 118, 138 104, 122 96" fill="none"/>
    <!-- штекер слева -->
    <rect x="66" y="88" width="18" height="16" rx="4" fill="none"/>
    <line x1="84" y1="93" x2="92" y2="93"/>
    <line x1="84" y1="101" x2="92" y2="101"/>
    <!-- розетка справа -->
    <rect x="116" y="88" width="18" height="16" rx="4" fill="none"/>
    <line x1="108" y1="93" x2="116" y2="93"/>
    <line x1="108" y1="101" x2="116" y2="101"/>
    <!-- антенна-волны (потухшие) -->
    <path d="M78 62 A 30 30 0 0 1 122 62" fill="none" stroke-dasharray="3 6" opacity="0.7"/>
    <path d="M66 48 A 46 46 0 0 1 134 48" fill="none" stroke-dasharray="3 6" opacity="0.45"/>
    <!-- крестик разрыва -->
    <line x1="88" y1="132" x2="112" y2="156"/>
    <line x1="112" y1="132" x2="88" y2="156"/>
  </g>
  <!-- акцентная искра между контактами -->
  <path d="M100 82 L95 96 L101 96 L96 112 L110 94 L103 94 L107 82 Z" fill="#FBBF24" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.35;0.95" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
